# NightShift local stack.
# Profiles:
#   target     — Spring Boot services, Postgres, Redis, Toxiproxy, chaos controller, k6 load
#   telemetry  — grafana/otel-lgtm (OTel Collector + Prometheus + Loki + Tempo + Grafana)
#   nightshift — harness/API/UI (Phase 2+; empty for now)
# Every container has a mem_limit; the total must stay well inside Docker Desktop's 6 GB.
name: nightshift

x-jvm-service: &jvm-service
  image: nightshift/target:dev
  build:
    context: ./target
    dockerfile: docker/Dockerfile
  profiles: [target]
  restart: unless-stopped
  mem_limit: 448m
  volumes:
    - releases:/releases
  environment: &jvm-env
    JAVA_OPTS: >-
      -Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m
      -Xss512k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
    OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_METRIC_EXPORT_INTERVAL: "10000"
    OTEL_BSP_SCHEDULE_DELAY: "2000"
    OTEL_BLRP_SCHEDULE_DELAY: "2000"
    OTEL_INSTRUMENTATION_MICROMETER_ENABLED: "true"
    OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_KEY_VALUE_PAIR_ATTRIBUTES: "true"
    POSTGRES_USER: ${POSTGRES_USER:-nightshift}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    POSTGRES_DB: ${POSTGRES_DB:-nightshift}
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:$${SERVER_PORT}/actuator/health/readiness || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 30s
  depends_on: &jvm-deps
    postgres:
      condition: service_healthy
    toxiproxy:
      condition: service_started

services:
  lgtm:
    image: grafana/otel-lgtm:0.36.0
    profiles: [telemetry]
    mem_limit: 2048m
    ports:
      - "3000:3000"   # Grafana
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "9090:9090"   # Prometheus API
      - "3100:3100"   # Loki API (not published by the image by default)
      - "3200:3200"   # Tempo API
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      PROMETHEUS_EXTRA_ARGS: --storage.tsdb.retention.time=2d
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env (see .env.example)}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/nightshift/nightshift-overview.json
    volumes:
      - ./telemetry/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./telemetry/rules:/otel-lgtm/rules:ro
      - ./telemetry/grafana/dashboards/provider.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/nightshift.yaml:ro
      - ./telemetry/grafana/dashboards/nightshift-overview.json:/otel-lgtm/grafana/conf/provisioning/dashboards/nightshift/nightshift-overview.json:ro
      - ./telemetry/grafana/datasources/nightshift-postgres.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/nightshift-postgres.yaml:ro
      - lgtm-data:/data

  alertmanager:
    image: prom/alertmanager:v0.34.1
    profiles: [telemetry]
    mem_limit: 64m
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./telemetry/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"

  # --- target: data stores and network fault proxy --------------------------------------------
  postgres:
    image: postgres:16.15-alpine
    profiles: [target]
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nightshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-nightshift}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env (see .env.example)}
    command: >-
      postgres -c shared_buffers=64MB -c max_connections=60 -c work_mem=4MB
      -c max_parallel_workers_per_gather=0 -c log_min_duration_statement=1000
    volumes:
      - ./target/db/init:/docker-entrypoint-initdb.d:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7.4.11-alpine
    profiles: [target]
    mem_limit: 64m
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru --save "" --appendonly no

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: [target]
    mem_limit: 48m
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./chaos/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "127.0.0.1:8474:8474"
    depends_on:
      - redis
      - postgres

  # --- target: chaos controller / ops API -----------------------------------------------------
  chaos-controller:
    <<: *jvm-service
    mem_limit: 320m
    environment:
      <<: *jvm-env
      SERVICE: chaos-controller
      SERVER_PORT: "8090"
      BASELINE_VERSION: "1.0"
      # Test infrastructure: keep injection activity out of the telemetry agents will read.
      OTEL_JAVAAGENT_ENABLED: "false"
      NIGHTSHIFT_SCENARIOS_DIR: /scenarios
      NIGHTSHIFT_ALERT_RECEIVER_URL: http://chaos-controller:8090/ops/alerts
      JAVA_OPTS: >-
        -Xms64m -Xmx128m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m
        -Xss512k -XX:+UseSerialGC
    volumes:
      - releases:/releases
      - ./evals/scenarios:/scenarios:ro
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

  # --- target: services (request path gateway -> orders -> payments -> inventory) -------------
  gateway:
    <<: *jvm-service
    environment:
      <<: *jvm-env
      SERVICE: gateway
      SERVER_PORT: "8080"
      BASELINE_VERSION: "2.0"
    ports:
      - "8080:8080"

  orders:
    <<: *jvm-service
    environment:
      <<: *jvm-env
      SERVICE: orders
      SERVER_PORT: "8081"
      BASELINE_VERSION: "3.1"
    ports:
      - "127.0.0.1:8081:8081"

  payments:
    <<: *jvm-service
    environment:
      <<: *jvm-env
      SERVICE: payments
      SERVER_PORT: "8082"
      BASELINE_VERSION: "1.3"
    ports:
      - "127.0.0.1:8082:8082"

  inventory:
    <<: *jvm-service
    environment:
      <<: *jvm-env
      SERVICE: inventory
      SERVER_PORT: "8083"
      BASELINE_VERSION: "2.2"
    ports:
      - "127.0.0.1:8083:8083"

  # --- target: load generator (pause with scripts/load.sh pause) -------------------------------
  k6:
    image: grafana/k6:2.3.0
    profiles: [target]
    mem_limit: 192m
    restart: unless-stopped
    command: ["run", "--quiet", "/scripts/steady.js"]
    environment:
      BASE_URL: http://gateway:8080
      K6_RATE: ${K6_RATE:-8}
    volumes:
      - ./loadgen/k6:/scripts:ro
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  releases:
  lgtm-data:
  pg-data:
