# Alert rules for the NightShift target system. Evaluated by the Prometheus inside otel-lgtm,
# delivered by Alertmanager to the alert receiver (stub now, NightShift API from Phase 2).
# Series come from the OpenTelemetry Java agent: http_server_request_duration_seconds_*,
# jvm_memory_*_bytes, and process_start_time_seconds (Micrometer bridge).
groups:
  - name: nightshift-target
    interval: 15s
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum by (service_name) (rate(http_server_request_duration_seconds_count{http_route!~"/actuator.*|/admin.*|/internal.*", http_response_status_code=~"5.."}[2m]))
            /
            sum by (service_name) (rate(http_server_request_duration_seconds_count{http_route!~"/actuator.*|/admin.*|/internal.*"}[2m]))
          ) > 0.05
          and
          sum by (service_name) (rate(http_server_request_duration_seconds_count{http_route!~"/actuator.*|/admin.*|/internal.*"}[2m])) > 0.2
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.service_name }} 5xx ratio is {{ $value | humanizePercentage }} (> 5 %)"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (service_name, le) (rate(http_server_request_duration_seconds_bucket{http_route!~"/actuator.*|/admin.*|/internal.*"}[3m]))
          ) > 1
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.service_name }} p95 latency is {{ $value | humanizeDuration }} (> 1 s)"

      - alert: ServiceRestarting
        # Two or more restarts of the same version in 10 minutes: a restart loop. Counting per
        # service_version keeps deploys (which start a new version series) from firing it.
        expr: |
          max by (service_name) (changes(process_start_time_seconds[10m])) >= 2
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.service_name }} restarted {{ $value }} times in 10 minutes"

      - alert: JvmHeapHigh
        expr: |
          sum by (service_name) (jvm_memory_used_bytes{jvm_memory_type="heap"})
          /
          sum by (service_name) (jvm_memory_limit_bytes{jvm_memory_type="heap"})
          > 0.85
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }} heap is {{ $value | humanizePercentage }} of max"
