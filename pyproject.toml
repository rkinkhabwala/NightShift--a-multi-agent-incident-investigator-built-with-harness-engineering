[project]
name = "nightshift"
version = "0.2.0"
description = "Multi-agent incident investigator built with harness engineering (local Ollama models)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs a running Ollama and/or the Phase 1 stack (skipped by default)"]
addopts = "-m 'not live'"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
# Not installed into the venv: files written under this folder's .venv get a macOS "hidden" flag and
# Python 3.12 skips hidden .pth files, which silently breaks editable installs. Code runs from the repo
# root instead: ./nightshift (CLI), pytest (pythonpath = "."), and dev scripts add the root themselves.
package = false
