spring:
  config:
    import: classpath:nightshift-common.yml
  application:
    default-name: payments
  datasource:
    # Through Toxiproxy (pg-payments) so S06 can cut this service off from its database.
    url: jdbc:postgresql://${DB_HOST:toxiproxy}:${DB_PORT:15432}/${POSTGRES_DB:nightshift}
    username: ${POSTGRES_USER:nightshift}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 6
      minimum-idle: 2
      connection-timeout: 2000
server:
  port: 8082
