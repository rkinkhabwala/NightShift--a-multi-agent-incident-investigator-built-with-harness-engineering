spring:
  config:
    import: classpath:nightshift-common.yml
  application:
    default-name: gateway
  datasource:
    # Only for the gateway's own config/flag store (ops schema).
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB:nightshift}
    username: ${POSTGRES_USER:nightshift}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
server:
  port: 8080
