spring:
  config:
    import: classpath:nightshift-common.yml
  application:
    default-name: orders
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB:nightshift}
    username: ${POSTGRES_USER:nightshift}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      # Live values come from the orders.db.pool.* config settings (PoolSettings).
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
server:
  port: 8081
